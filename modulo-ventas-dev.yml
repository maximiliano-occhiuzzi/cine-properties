server:
  port: 8084

spring:
  datasource:
    url: jdbc:h2:mem:ventasdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# Access token de PRUEBA (sandbox) de la app "cine-tp" en Mercado Pago
# Developers, asociado al usuario de prueba vendedor (TESTUSER8329823221133887088).
# No mueve plata real. NO commitear este archivo con el token real a un repo
# publico — esto queda solo en la maquina local de quien lo corre.
#
# notification-url tiene que ser una URL PUBLICA (Mercado Pago la llama desde
# afuera para avisar que un pago se acredito) — localhost no sirve porque sus
# servidores no pueden llegar a tu maquina. Mientras se prueba localmente se
# usa un tunel de ngrok (`ngrok http 8081`); esa URL cambia cada vez que se
# reinicia ngrok (plan free), asi que hay que actualizarla aca cada vez.
mercadopago:
  access-token: "APP_USR-584951954015672-101720-bd5f0e821f9371025d695a2d2dee2517-3774264210"
  notification-url: "https://juiciness-photo-senior.ngrok-free.dev/ventas/webhook/mercadopago"

# A donde redirige Mercado Pago el NAVEGADOR del comprador despues de pagar
# (botones "Volver al sitio" / auto_return). A diferencia de notification-url
# esto no lo llama Mercado Pago por su cuenta, lo sigue el navegador del
# usuario, asi que localhost anda perfecto: no hace falta ngrok para esto.
app:
  frontend-url: "http://localhost:4200"

openapi:
  gateway-url: "http://localhost:8081"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10

feign:
  # El cliente HTTP por defecto de Feign (HttpURLConnection) no soporta PATCH
  # y hacia fallar en silencio el ajuste de stock en Productos. OkHttp si.
  okhttp:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 3000
