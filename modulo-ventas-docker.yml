  access-token: "APP_USR-584951954015672-101720-bd5f0e821f9371025d695a2d2dee2517-3774264210"
  notification-url: "http://localhost:8081/ventas/webhook/mercadopago"

# A donde vuelve el navegador del comprador despues de pagar (no es una
# llamada de Mercado Pago al backend, asi que localhost anda bien).
app:
  frontend-url: "http://localhost:4200"

openapi:
  gateway-url: "http://localhost:8081"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://registry:8761/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10

feign:
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 3000
