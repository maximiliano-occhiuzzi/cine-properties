server:
  port: 8084

spring:
  datasource:
    url: jdbc:h2:mem:ventasdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

# Sin esto, Ventas no puede generar preferencias de pago reales (Mercado
# Pago responde 401) pero el resto de la compra (crear venta, validar
# butacas/productos, publicar eventos) funciona igual. Completar con un
# access token de prueba (sandbox) de una cuenta de Mercado Pago del equipo.
mercadopago:
  access-token: ""
  notification-url: "http://localhost:8081/ventas/webhook/mercadopago"

openapi:
  gateway-url: "http://localhost:8081"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://registry:8761/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
