server:
  port: 8084

spring:
  datasource:
    url: jdbc:mysql://ventas-db:3306/ventas_database?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ventas_user
    password: ${VENTAS_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# Antes el access token de Mercado Pago (sandbox) estaba commiteado en texto
# plano en este archivo. Se externaliza igual que JWT_SECRET/GATEWAY_INTERNAL_SECRET:
# tiene que llegar como variable de entorno del proceso de Ventas.
#
# notification-url: a donde le pega MERCADO PAGO (un servidor externo, no tu
# PC) para avisar que un pago se acredito. "http://localhost:8081/..." NO
# sirve en Docker -Mercado Pago no puede resolver "localhost" tuyo- hace
# falta una URL publica real (ngrok, ver docker-compose.yml) apuntando al
# gateway. El default de aca abajo es el mismo de siempre (dev local sin
# Docker), asi el servicio igual arranca sin ngrok: el webhook en si no va a
# funcionar, pero el resto del sistema (compra, historial, etc.) si.
mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN}
  notification-url: ${MERCADOPAGO_NOTIFICATION_URL:http://localhost:8081/ventas/webhook/mercadopago}

# A donde vuelve el navegador del comprador despues de pagar (no es una
# llamada de Mercado Pago al backend, asi que localhost anda bien).
app:
  frontend-url: "http://localhost:4200"

openapi:
  gateway-url: "http://localhost:8081"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://registry:8761/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10

feign:
  # El cliente HTTP por defecto de Feign (HttpURLConnection) no soporta PATCH
  # y hacia fallar en silencio el ajuste de stock en Productos. OkHttp si.
  okhttp:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 3000
