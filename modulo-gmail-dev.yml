server:
  port: 8085

spring:
  datasource:
    url: jdbc:h2:mem:gmaildb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  mail:
    host: smtp.gmail.com
    port: 587
    # Cuenta de Gmail y su "contrasena de aplicacion" (NO la contrasena normal;
    # se genera en la cuenta de Google con verificacion en 2 pasos activada).
    # Van como variables de entorno del proceso Gmail, nunca escritas aca.
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Corta la conexion al SMTP si se cuelga, en vez de dejar el hilo del
          # listener trabado para siempre (pasado el tiempo pasa a ERROR).
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        # Si el listener falla, no se reencola en loop infinito.
        default-requeue-rejected: false
        # Reintentos con backoff exponencial (1s, 2s, 4s) antes de mandar el
        # mensaje a la DLQ (venta.eventos.dlq).
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10

feign:
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 3000
