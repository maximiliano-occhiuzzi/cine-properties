server:
  port: 8085

spring:
  datasource:
    url: jdbc:h2:mem:gmaildb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  mail:
    host: smtp.gmail.com
    port: 587
    # Cuenta de Gmail y su "contrasena de aplicacion" (NO la contrasena normal;
    # se genera en la cuenta de Google con verificacion en 2 pasos activada).
    # Van como variables de entorno del proceso Gmail, nunca escritas aca.
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
