server:
  port: 8087

spring:
  # No necesita datasource propio: sin spring.datasource.url, Spring Boot
  # levanta una H2 embebida en memoria automaticamente (igual que
  # Ventas/Auth/Productos/Gmail).
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
