server:
  port: 8083

spring:
  # Perfil "docker": MySQL real, tal cual lo armo mi compañera.
  # Requiere un contenedor MySQL accesible con hostname "mysqldb" (agregarlo
  # al docker-compose.yml del equipo si todavia no esta, con esa misma red).
  datasource:
    url: jdbc:mysql://mysqldb:3306/db_salas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: rootpassword
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://registry:8761/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
